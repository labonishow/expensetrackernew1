<!doctype html>

<html>
  <head>
    <title>Reset Password</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
      }

      .container {
        width: 350px;
        margin: 100px auto;
        background: white;
        padding: 30px;
        border-radius: 10px;
      }

      input {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        margin-bottom: 15px;
        box-sizing: border-box;
      }

      button {
        width: 100%;
        padding: 12px;
        background: #007bff;
        color: white;
        border: none;
        cursor: pointer;
      }

      button:hover {
        background: #0056b3;
      }

      #message {
        margin-top: 15px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Reset Password</h2>

      <form id="resetForm">
        <label> New Password </label>

        <input
          type="password"
          id="password"
          placeholder="Enter new password"
          required
        />

        <label> Confirm Password </label>

        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm new password"
          required
        />

        <button type="submit">Reset Password</button>
      </form>

      <div id="message"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.2/axios.min.js"></script>
    <script src="config.js"></script>

    <script>
      const form = document.getElementById("resetForm");

      const message = document.getElementById("message");

      // requestId comes from the QUERY STRING now, e.g.
      // resetpassword.html?requestId=40482cba-aa08-4394-92de-a083076d3d16
      const requestId = new URLSearchParams(window.location.search).get(
        "requestId",
      );

      // Validate the link as soon as the page loads
      (async function checkLinkValidity() {
        if (!requestId) {
          form.style.display = "none";
          message.innerText = "Invalid reset link: no request ID found.";
          return;
        }

        try {
          await axios.get(
            `${API_BASE_URL}/password/resetpassword/${requestId}`,
          );

          // Link is valid — leave the form visible
          message.innerText = "";
        } catch (error) {
          form.style.display = "none";

          if (error.response) {
            message.innerText = error.response.data.message;
          } else {
            console.error(error);
            message.innerText = "Something went wrong verifying this link.";
          }
        }
      })();

      form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const password = document.getElementById("password").value;

        const confirmPassword =
          document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {
          message.innerText = "Passwords do not match.";

          return;
        }

        if (password.length < 6) {
          message.innerText = "Password must contain at least 6 characters.";

          return;
        }

        try {
          const response = await axios.post(
            `${API_BASE_URL}/password/resetpassword/${requestId}`,
            { password: password },
          );

          message.innerText = response.data.message;

          // Optional redirect to login

          setTimeout(() => {
            window.location.href = "../signup/signup.html";
          }, 2000);
        } catch (error) {
          if (error.response) {
            message.innerText = error.response.data.message;
          } else {
            console.error(error);
            message.innerText = "Something went wrong.";
          }
        }
      });
    </script>
  </body>
</html>
